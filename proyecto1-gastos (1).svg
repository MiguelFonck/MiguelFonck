<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Simulador de gastos en consola con barras por categoría" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0C12"/><stop offset="1" stop-color="#17132B"/></linearGradient>
<radialGradient id="g" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#8B7CFF" stop-opacity=".25"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient>
</defs>
<style>
.t{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.m{font-family:Consolas,"Courier New",monospace}
.in{opacity:0;animation:fi .6s ease forwards}
@keyframes fi{to{opacity:1}}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:gr .9s cubic-bezier(.3,.8,.3,1) forwards}@keyframes gr{to{transform:scaleX(1)}}.cur{opacity:0;animation:bl 1s steps(1) 3.4s infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}}
</style>
<rect width="800" height="450" rx="18" fill="url(#bg)"/><rect width="800" height="450" rx="18" fill="url(#g)"/>
<rect x="1" y="1" width="798" height="448" rx="17" fill="none" stroke="#2E3350" stroke-width="2"/>
<rect x="60" y="50" width="680" height="350" rx="14" fill="#0E0F1C" stroke="#2E3350" stroke-width="2"/><line x1="60" y1="92" x2="740" y2="92" stroke="#2E3350" stroke-width="2"/><circle cx="90" cy="71" r="6" fill="#FF8FAB"/><circle cx="112" cy="71" r="6" fill="#B3ABEA"/><circle cx="134" cy="71" r="6" fill="#8B7CFF"/><text class="m" x="400" y="77" font-size="16" fill="#7C7AA6" text-anchor="middle">gastos.json</text><text class="m in" x="90" y="140" font-size="22" fill="#B3ABEA" style="animation-delay:.3s">$ python gastos.py</text><text class="m in" x="90" y="205" font-size="21" fill="#F2F0FF" style="animation-delay:1.0s">Comida</text><rect class="bar" x="260" y="190" width="300" height="20" rx="5" fill="#8B7CFF" style="animation-delay:1.0s"/><text class="m in" x="574" y="206" font-size="19" fill="#B3ABEA" style="animation-delay:1.9s">$45.000</text><text class="m in" x="90" y="255" font-size="21" fill="#F2F0FF" style="animation-delay:1.6s">Transporte</text><rect class="bar" x="260" y="240" width="190" height="20" rx="5" fill="#FF8FAB" style="animation-delay:1.6s"/><text class="m in" x="464" y="256" font-size="19" fill="#B3ABEA" style="animation-delay:2.5s">$28.000</text><text class="m in" x="90" y="305" font-size="21" fill="#F2F0FF" style="animation-delay:2.2s">Ocio</text><rect class="bar" x="260" y="290" width="110" height="20" rx="5" fill="#B3ABEA" style="animation-delay:2.2s"/><text class="m in" x="384" y="306" font-size="19" fill="#B3ABEA" style="animation-delay:3.1s">$12.000</text><line x1="90" y1="338" x2="710" y2="338" stroke="#2E3350" stroke-width="2" stroke-dasharray="4 6"/><text class="m in" x="90" y="378" font-size="22" font-weight="700" fill="#F2F0FF" style="animation-delay:3s">Total  $85.000</text><rect class="cur" x="330" y="360" width="12" height="22" fill="#FF8FAB"/>
</svg>