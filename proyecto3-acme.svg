<radialGradient id="g" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#8B7CFF" stop-opacity=".25"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient>
</defs>
<style>
